<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Gentium Book Plus, Georgia, serif">
  <rect width="760" height="320" fill="#FBF8F0"/>
  <!-- box 1 -->
  <rect x="10" y="30" width="166" height="130" fill="#EDE4CE" stroke="#D8CDB3"/>
  <text x="24" y="58" font-size="14" fill="#2A2925" font-weight="700">Uitgewerkt</text>
  <text x="24" y="76" font-size="14" fill="#2A2925" font-weight="700">voorbeeld</text>
  <text x="24" y="100" font-size="11" fill="#5E584C">bestudeer een volledige</text>
  <text x="24" y="115" font-size="11" fill="#5E584C">oplossing, met subgoal</text>
  <text x="24" y="130" font-size="11" fill="#5E584C">labels per stap</text>
  <!-- arrow -->
  <line x1="180" y1="95" x2="199" y2="95" stroke="#7E9A7C" stroke-width="2"/>
  <polygon points="204,95 195,90 195,100" fill="#7E9A7C"/>
  <!-- box 2 -->
  <rect x="203" y="30" width="166" height="130" fill="#EDE4CE" stroke="#D8CDB3"/>
  <text x="217" y="58" font-size="14" fill="#2A2925" font-weight="700">Parsons-opgave</text>
  <text x="217" y="100" font-size="11" fill="#5E584C">orden de regels van</text>
  <text x="217" y="115" font-size="11" fill="#5E584C">een correcte oplossing</text>
  <text x="217" y="130" font-size="11" fill="#5E584C">in de juiste volgorde</text>
  <!-- arrow -->
  <line x1="373" y1="95" x2="392" y2="95" stroke="#7E9A7C" stroke-width="2"/>
  <polygon points="397,95 388,90 388,100" fill="#7E9A7C"/>
  <!-- box 3 -->
  <rect x="396" y="30" width="166" height="130" fill="#EDE4CE" stroke="#D8CDB3"/>
  <text x="410" y="58" font-size="14" fill="#2A2925" font-weight="700">Aanvulopgave</text>
  <text x="410" y="100" font-size="11" fill="#5E584C">vul de ontbrekende</text>
  <text x="410" y="115" font-size="11" fill="#5E584C">delen van een oplossing</text>
  <text x="410" y="130" font-size="11" fill="#5E584C">zelf aan</text>
  <!-- arrow -->
  <line x1="566" y1="95" x2="585" y2="95" stroke="#7E9A7C" stroke-width="2"/>
  <polygon points="590,95 581,90 581,100" fill="#7E9A7C"/>
  <!-- box 4 -->
  <rect x="589" y="30" width="161" height="130" fill="#EDE4CE" stroke="#D8CDB3"/>
  <text x="603" y="58" font-size="14" fill="#2A2925" font-weight="700">Zelf schrijven</text>
  <text x="603" y="100" font-size="11" fill="#5E584C">los een nieuw</text>
  <text x="603" y="115" font-size="11" fill="#5E584C">probleem volledig</text>
  <text x="603" y="130" font-size="11" fill="#5E584C">zelfstandig op</text>
  <!-- support wedge -->
  <polygon points="10,200 750,200 750,212 10,262" fill="#7E9A7C"/>
  <text x="24" y="228" font-size="12" fill="#FBF8F0" font-weight="700">ondersteuning van de docent</text>
  <line x1="10" y1="284" x2="738" y2="284" stroke="#9E3B2D" stroke-width="2"/>
  <polygon points="750,284 738,279 738,289" fill="#9E3B2D"/>
  <text x="10" y="306" font-size="12" fill="#9E3B2D" font-weight="700">zelfstandigheid van de student</text>
</svg>
