<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Gentium Book Plus, Georgia, serif">
  <rect width="760" height="430" fill="#FBF8F0"/>
  <!-- step 1 -->
  <rect x="10" y="300" width="170" height="96" fill="#EDE4CE" stroke="#D8CDB3"/>
  <text x="26" y="336" font-size="26" fill="#B07D2B" font-weight="700">1</text>
  <text x="26" y="358" font-size="14.5" fill="#2A2925" font-weight="700">Code traceren</text>
  <text x="26" y="378" font-size="11" fill="#5E584C" font-style="italic">lezen &#183; semantiek</text>
  <!-- step 2 -->
  <rect x="195" y="230" width="170" height="166" fill="#EDE4CE" stroke="#D8CDB3"/>
  <text x="211" y="266" font-size="26" fill="#B07D2B" font-weight="700">2</text>
  <text x="211" y="288" font-size="14.5" fill="#2A2925" font-weight="700">Correcte syntax</text>
  <text x="211" y="306" font-size="14.5" fill="#2A2925" font-weight="700">schrijven</text>
  <text x="211" y="326" font-size="11" fill="#5E584C" font-style="italic">schrijven &#183; semantiek</text>
  <!-- step 3 -->
  <rect x="380" y="160" width="170" height="236" fill="#EDE4CE" stroke="#D8CDB3"/>
  <text x="396" y="196" font-size="26" fill="#B07D2B" font-weight="700">3</text>
  <text x="396" y="218" font-size="14.5" fill="#2A2925" font-weight="700">Patronen in code</text>
  <text x="396" y="236" font-size="14.5" fill="#2A2925" font-weight="700">herkennen</text>
  <text x="396" y="256" font-size="11" fill="#5E584C" font-style="italic">lezen &#183; patronen</text>
  <!-- step 4 -->
  <rect x="565" y="90" width="170" height="306" fill="#EDE4CE" stroke="#D8CDB3"/>
  <text x="581" y="126" font-size="26" fill="#B07D2B" font-weight="700">4</text>
  <text x="581" y="148" font-size="14.5" fill="#2A2925" font-weight="700">Patronen gebruiken</text>
  <text x="581" y="166" font-size="14.5" fill="#2A2925" font-weight="700">bij nieuwe</text>
  <text x="581" y="184" font-size="14.5" fill="#2A2925" font-weight="700">problemen</text>
  <text x="581" y="204" font-size="11" fill="#5E584C" font-style="italic">schrijven &#183; patronen</text>
  <!-- rising accent line -->
  <polyline points="30,290 215,220 400,150 585,80" fill="none" stroke="#9E3B2D" stroke-width="2"/>
  <polygon points="585,80 573,82 580,91" fill="#9E3B2D"/>
  <!-- caption -->
  <text x="10" y="420" font-size="11.5" fill="#5E584C">Elke vaardigheid steunt op de vorige: onderwijs en toets ze expliciet, in deze volgorde (naar Xie et al., 2019).</text>
</svg>
